name: API

# The members' sign-in API in api/, on Cloudflare Workers. Pull requests only check that it builds; main (or a manual
# run) deploys it, with the secrets from this repository's Actions secrets.
on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: api-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Find the members' database, or create it in the EU the first time
        run: |
          find_db() { npx wrangler d1 list --json | jq -r '.[] | select(.name == "vsc-members") | .uuid'; }
          id=$(find_db)
          if [ -z "$id" ]; then
            npx wrangler d1 create vsc-members --jurisdiction eu
            id=$(find_db)
          fi
          test -n "$id"
          sed -i "s/set-by-deploy/$id/" wrangler.jsonc
      - run: npx wrangler d1 migrations apply vsc-members --remote
      - name: Deploy, handing over the secrets
        env:
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # Optional: lets the hourly cron start a rebuild of the website.
          SITE_REBUILD_TOKEN: ${{ secrets.SITE_REBUILD_TOKEN }}
          # Optional: the Sesh calendar feed, so the home page can show event changes between rebuilds.
          SESH_ICS_URL: ${{ secrets.SESH_ICS_URL }}
        run: |
          test -n "$DISCORD_CLIENT_SECRET" || { echo "::error::The DISCORD_CLIENT_SECRET secret is missing"; exit 1; }
          test -n "$DISCORD_BOT_TOKEN" || { echo "::error::The DISCORD_BOT_TOKEN secret is missing"; exit 1; }
          secrets="$RUNNER_TEMP/secrets.json"
          trap 'rm -f "$secrets"' EXIT
          jq -n '{DISCORD_CLIENT_SECRET: env.DISCORD_CLIENT_SECRET, DISCORD_BOT_TOKEN: env.DISCORD_BOT_TOKEN}
            + if (env.SITE_REBUILD_TOKEN // "") != "" then {SITE_REBUILD_TOKEN: env.SITE_REBUILD_TOKEN} else {} end
            + if (env.SESH_ICS_URL // "") != "" then {SESH_ICS_URL: env.SESH_ICS_URL} else {} end' > "$secrets"
          test -n "$SITE_REBUILD_TOKEN" || echo "::warning::No SITE_REBUILD_TOKEN secret, so the website is rebuilt only when GitHub's own schedule runs"
          npx wrangler deploy --secrets-file "$secrets"
      - name: Check that the calendar answers
        working-directory: .
        run: |
          sleep 15
          if n=$(curl -fsS https://api.volsungclan.com/events | jq '.events | length'); then
            echo "The API serves $n upcoming events"
          else
            echo "::warning::GET /events did not answer; the home page keeps the events it was built with"
          fi
